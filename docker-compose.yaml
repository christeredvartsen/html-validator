services:
  vnu:
    image: ghcr.io/validator/validator:24.10.17
    depends_on:
      fixtures:
        condition: service_healthy
    healthcheck:
      test: timeout 3 bash -c '</dev/tcp/127.0.0.1/8888'
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "8888:8888"
  fixtures:
    image: nginx:1.31.4-alpine
    healthcheck:
      test: wget --quiet --spider http://127.0.0.1/document-invalid-utf8-html5.html
      interval: 1s
      timeout: 3s
      retries: 10
    volumes:
      - ./tests/fixtures:/usr/share/nginx/html:ro
      - ./tests/fixtures/nginx.conf:/etc/nginx/conf.d/default.conf:ro
